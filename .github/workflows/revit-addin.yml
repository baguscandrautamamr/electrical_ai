## Builds the Revit 2025 add-in.
##
## GitHub runners have no Revit install, so the project compiles against the
## NuGet reference assemblies (see UseRevitNuGet in the .csproj). That checks the
## code against the real Revit 2025 API surface; it cannot check behaviour inside
## Revit, which still needs a machine with Revit installed.
##
## The artifact is the folder to drop into
## %APPDATA%\Autodesk\Revit\Addins\2025\.

name: Revit add-in

on:
  push:
    paths:
      - 'revit-addin/**'
      - '.github/workflows/revit-addin.yml'
  pull_request:
    paths:
      - 'revit-addin/**'
      - '.github/workflows/revit-addin.yml'
  workflow_dispatch:

env:
  PROJECT: revit-addin/RevitCommandCenter.Electrical/RevitCommandCenter.Electrical.csproj
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    # net8.0-windows with UseWPF cannot be built on Linux.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "$env:PROJECT" -p:UseRevitNuGet=true

      - name: Build
        run: >
          dotnet build "$env:PROJECT"
          -c Release
          --no-restore
          -p:UseRevitNuGet=true
          -warnaserror:CS0618,CS0612

      # Revit only scans for .addin manifests sitting directly in
      # Addins\2025 — never inside a subfolder. But dropping ~100 dependency
      # DLLs loose in that shared folder invites version clashes with every
      # other add-in installed. So: manifest at the top, everything else in one
      # subfolder, with the manifest's Assembly path rewritten to match.
      - name: Stage the install folder
        shell: pwsh
        run: |
          $out   = "revit-addin/RevitCommandCenter.Electrical/bin/Release"
          $stage = "artifact"
          $lib   = Join-Path $stage "RevitCommandCenter.Electrical"
          New-Item -ItemType Directory -Force $lib | Out-Null

          $manifest = Join-Path $out "RevitCommandCenter.Electrical.addin"
          if (-not (Test-Path $manifest)) {
            throw "RevitCommandCenter.Electrical.addin is missing from the build output"
          }
          if (-not (Test-Path (Join-Path $out "RevitCommandCenter.Electrical.dll"))) {
            throw "RevitCommandCenter.Electrical.dll is missing from the build output"
          }

          Get-ChildItem $out -Exclude '*.addin' |
            Copy-Item -Destination $lib -Recurse -Force

          # Revit resolves Assembly relative to the .addin file.
          $from = '<Assembly>RevitCommandCenter.Electrical.dll</Assembly>'
          $to   = '<Assembly>RevitCommandCenter.Electrical\RevitCommandCenter.Electrical.dll</Assembly>'
          $xml  = Get-Content $manifest -Raw
          if ($xml -notmatch [regex]::Escape($from)) {
            throw "Assembly element not in the expected form; cannot rewrite its path"
          }
          $xml.Replace($from, $to) | Set-Content (Join-Path $stage "RevitCommandCenter.Electrical.addin")

          # Revit supplies these itself; a second copy in the load path is a
          # known source of type-identity errors.
          $leaked = Get-ChildItem $lib -Recurse -Filter 'RevitAPI*.dll'
          if ($leaked) { throw "Revit API assemblies leaked into the output: $($leaked.Name -join ', ')" }

          Write-Host "--- staged layout ---"
          Get-ChildItem $stage -Recurse -Name | Sort-Object
          Write-Host "--- $((Get-ChildItem $lib -Recurse -File).Count) files in the library folder ---"

      - name: Upload add-in
        uses: actions/upload-artifact@v4
        with:
          name: RevitCommandCenter.Electrical-2025
          if-no-files-found: error
          path: artifact/**
